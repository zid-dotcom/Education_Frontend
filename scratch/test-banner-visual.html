<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Materials Banner Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    padding: 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .banner {
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    background: linear-gradient(to right, #FAF6EE, #FDF9F2, #FAF1DF);
    border: 1px solid #ECDDC6;
    max-width: 1200px;
    margin: 0 auto;
  }
  .banner-inner {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 768px) {
    .banner-inner {
      flex-direction: row;
      align-items: stretch;
      justify-content: space-between;
      min-height: 240px;
    }
  }
  .banner-left {
    padding: 32px 40px;
    max-width: 580px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 10;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.95);
    border: 1px solid #ECD8B5;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #9C6B2E;
    width: fit-content;
    margin-bottom: 10px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    color: #17140F;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .desc {
    font-size: 14px;
    font-weight: 500;
    color: #6B6252;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.9);
    border: 1px solid #ECDDC6;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    color: #17140F;
    width: fit-content;
    cursor: pointer;
  }
  .banner-right {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    align-self: stretch;
    flex-shrink: 0;
    user-select: none;
    overflow: hidden;
  }
  .banner-ill-box {
    width: 100%;
    height: 200px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  @media (min-width: 640px) {
    .banner-ill-box {
      width: 460px;
      height: 220px;
    }
  }
  @media (min-width: 768px) {
    .banner-ill-box {
      width: 520px;
      height: 100%;
    }
  }
  @media (min-width: 1024px) {
    .banner-ill-box {
      width: 580px;
    }
  }
  .banner-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="banner-inner">
      <div class="banner-left">
        <span class="tag">Academic Resources</span>
        <h1 class="title">Study Materials &amp; Notes</h1>
        <p class="desc">Access and download verified course PDFs, lecture presentations, and reference guides provided by your faculty.</p>
        <button class="btn">&#8635; Refresh Materials</button>
      </div>
      <div class="banner-right">
        <div class="banner-ill-box">
          <svg class="banner-svg" viewBox="0 0 520 240" fill="none" preserveAspectRatio="xMaxYMax slice">
            <defs>
              <linearGradient id="warmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDE6B0" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#F5B942" stop-opacity="0.8" />
              </linearGradient>
              <linearGradient id="warmAmberSoft" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FCF0D6" stop-opacity="0.95" />
                <stop offset="100%" stop-color="#F9CB65" stop-opacity="0.6" />
              </linearGradient>
              <linearGradient id="sm_folderBody" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FCD34D" />
                <stop offset="100%" stop-color="#F59E0B" />
              </linearGradient>
              <linearGradient id="sm_folderFront" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDE68A" />
                <stop offset="40%" stop-color="#F59E0B" />
                <stop offset="100%" stop-color="#D97706" />
              </linearGradient>
              <linearGradient id="sm_redPdf" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F87171" />
                <stop offset="50%" stop-color="#EF4444" />
                <stop offset="100%" stop-color="#B91C1C" />
              </linearGradient>
              <linearGradient id="sm_greenDownload" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#34D399" />
                <stop offset="50%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#047857" />
              </linearGradient>
              <filter id="sm_deepShadow" x="-15%" y="-15%" width="130%" height="130%">
                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8B5E1E" flood-opacity="0.18" />
              </filter>
            </defs>

            <!-- Warm Swooshes touching (520, 0) top right and (520, 240) bottom right -->
            <path d="M 40 240 C 100 150, 160 80, 260 40 C 350 4, 430 0, 520 0 L 520 240 Z" fill="url(#warmAmberSoft)" />
            <path d="M 140 240 C 200 160, 270 100, 360 60 C 430 30, 480 15, 520 10 L 520 240 Z" fill="url(#warmGoldGrad)" />

            <!-- Floor shadow -->
            <ellipse cx="340" cy="238" rx="150" ry="6" fill="#EADEC9" opacity="0.6" />

            <!-- 1. STACK OF BOOKS ON LEFT (touches bottom y=240) -->
            <g transform="translate(80, 155)" filter="url(#sm_deepShadow)">
              <!-- Bottom Dark Navy Book -->
              <rect x="0" y="45" width="135" height="40" rx="4" fill="#0F172A" />
              <rect x="0" y="45" width="12" height="40" rx="2" fill="#1E293B" />
              <rect x="12" y="50" width="120" height="30" rx="2" fill="#FFFFFF" />
              <line x1="16" y1="58" x2="128" y2="58" stroke="#E2E8F0" stroke-width="1.5" />
              <line x1="16" y1="65" x2="128" y2="65" stroke="#CBD5E1" stroke-width="1.5" />
              <line x1="16" y1="72" x2="128" y2="72" stroke="#E2E8F0" stroke-width="1.5" />

              <!-- Top Cobalt Blue Book -->
              <rect x="12" y="12" width="125" height="36" rx="4" fill="#2563EB" />
              <rect x="12" y="12" width="10" height="36" rx="2" fill="#60A5FA" opacity="0.7" />
              <rect x="22" y="16" width="112" height="28" rx="2" fill="#FFFFFF" />
              <line x1="26" y1="23" x2="130" y2="23" stroke="#E2E8F0" stroke-width="1.5" />
              <line x1="26" y1="30" x2="130" y2="30" stroke="#CBD5E1" stroke-width="1.5" />
              <line x1="26" y1="37" x2="130" y2="37" stroke="#E2E8F0" stroke-width="1.5" />
            </g>

            <!-- 2. LARGE 3D GOLDEN FOLDER (TABS AT TOP y=8, FOLDER BASE AT y=240) -->
            <g transform="translate(205, 0)" filter="url(#sm_deepShadow)">
              <!-- Folder Back Wall -->
              <rect x="25" y="38" width="195" height="202" rx="16" fill="url(#sm_folderBody)" />

              <!-- 4 FORMAT TABS ON TOP (start at y=8) -->
              <!-- Tab 1: PDF (Blue) -->
              <g transform="translate(42, 8)">
                <rect x="0" y="0" width="34" height="28" rx="6" fill="#2563EB" />
                <rect x="0" y="12" width="34" height="16" fill="#2563EB" />
                <text x="17" y="16" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="900" font-family="sans-serif">PDF</text>
              </g>

              <!-- Tab 2: PPT (Orange) -->
              <g transform="translate(80, 8)">
                <rect x="0" y="0" width="34" height="28" rx="6" fill="#EA580C" />
                <rect x="0" y="12" width="34" height="16" fill="#EA580C" />
                <text x="17" y="16" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="900" font-family="sans-serif">PPT</text>
              </g>

              <!-- Tab 3: DOC (Indigo) -->
              <g transform="translate(118, 8)">
                <rect x="0" y="0" width="34" height="28" rx="6" fill="#4F46E5" />
                <rect x="0" y="12" width="34" height="16" fill="#4F46E5" />
                <text x="17" y="16" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="900" font-family="sans-serif">DOC</text>
              </g>

              <!-- Tab 4: XLS (Green) -->
              <g transform="translate(156, 8)">
                <rect x="0" y="0" width="34" height="28" rx="6" fill="#16A34A" />
                <rect x="0" y="12" width="34" height="16" fill="#16A34A" />
                <text x="17" y="16" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="900" font-family="sans-serif">XLS</text>
              </g>

              <!-- White Paper Inside Folder -->
              <g transform="translate(38, 28)">
                <rect x="0" y="0" width="168" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
                <line x1="18" y1="24" x2="150" y2="24" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" />
                <line x1="18" y1="38" x2="140" y2="38" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
                <line x1="18" y1="50" x2="144" y2="50" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
                <line x1="18" y1="62" x2="130" y2="62" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
                <line x1="18" y1="74" x2="115" y2="74" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
              </g>

              <!-- Folder Front Flap (touches bottom y=240) -->
              <path
                d="M 18 72 Q 12 76 12 86 L 22 240 L 210 240 L 224 86 Q 226 76 216 72 L 140 72 Q 130 72 124 80 L 118 86 Q 112 90 102 90 L 28 90 Q 20 90 18 72 Z"
                fill="url(#sm_folderFront)"
                stroke="#D97706"
                stroke-width="1"
              />
              <path
                d="M 22 91 L 102 91 Q 112 91 118 87 L 124 81 Q 130 73 140 73 L 215 73"
                stroke="#FEF3C7"
                stroke-width="1.5"
                fill="none"
              />
            </g>

            <!-- 3. RED PDF 3D ICON BLOCK (Touches bottom y=240) -->
            <g transform="translate(412, 126)" filter="url(#sm_deepShadow)">
              <rect x="0" y="0" width="80" height="114" rx="14" fill="url(#sm_redPdf)" />
              <path d="M 52 0 L 80 28 L 52 28 Z" fill="#DC2626" opacity="0.6" />
              <path d="M 52 0 L 52 28 L 80 28" fill="#FCA5A5" opacity="0.8" />
              <text x="40" y="68" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="900" font-family="sans-serif" letter-spacing="1">
                PDF
              </text>
            </g>

            <!-- 4. FLOATING GREEN DOWNLOAD BADGE (Upper Right) -->
            <g transform="translate(432, 45)" filter="url(#sm_deepShadow)">
              <circle cx="34" cy="34" r="32" fill="url(#sm_greenDownload)" stroke="#FFFFFF" stroke-width="3" />
              <line x1="34" y1="20" x2="34" y2="36" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
              <path d="M 25 31 L 34 40 L 43 31" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="22" y1="47" x2="46" y2="47" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
